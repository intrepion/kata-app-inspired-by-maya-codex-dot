<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Kinframe motion review</title><link rel="icon" href="../favicon.svg"><style>body{font:14px system-ui;background:#f6f4ef;color:#283b42;margin:24px}h1{font:32px Georgia;margin:0}h2{font-size:17px;margin:22px 0 10px}p{color:#61746c;margin:7px 0 14px}.poses{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.pose{background:#fffefb;border:1px solid #d8dfd4;border-radius:12px;overflow:hidden}.pose svg{display:block;width:100%;height:255px}.pose b{display:block;padding:10px 14px;border-top:1px solid #e0e4dd}iframe{position:absolute;left:-3000px;width:1200px;height:900px}small{color:#718476} @media(max-width:600px){.poses{grid-template-columns:repeat(2,1fr)}}</style><h1>Kinframe · Motion review</h1><p>Actual application renders. Grounded steps and a staged greeting, with the same editable keys used by playback and export.</p><h2>Little steps <small>24-frame cycle · 24 fps</small></h2><section class="poses" id="walk"></section><h2>Hello, world <small>Anticipate · raise · wave · settle</small></h2><section class="poses" id="wave"></section><p id="result">Preparing poses…</p><iframe id="app" src="../index.html" title="Application rendering source"></iframe><script type="module">
const iframe=document.querySelector('#app');if(iframe.contentDocument.readyState!=='complete'||!iframe.contentDocument.querySelector('#viewport'))await new Promise(r=>iframe.addEventListener('load',r,{once:true}));
const win=iframe.contentWindow,doc=iframe.contentDocument,$=s=>doc.querySelector(s),stored=localStorage.getItem('kata-kinframe-v1');win.confirm=()=>true;
$('#controls').checked=false;$('#controls').dispatchEvent(new win.Event('change'));
for(const [name,frames] of [['walk',[[0,'Contact'],[3,'Down / weight transfer'],[6,'Passing / foot clearance'],[9,'Up / approaching contact']]],['wave',[[6,'Anticipation'],[24,'Arm raised'],[39,'Bent-elbow wave'],[90,'Return and settle']]]]){
 $('[data-preset="'+name+'"]').click();
 for(const [frame,label] of frames){$('#scrubber').value=frame;$('#scrubber').dispatchEvent(new win.Event('input'));
  const section=document.createElement('article');section.className='pose';const svg=$('#viewport').cloneNode(true);svg.removeAttribute('id');svg.setAttribute('viewBox','310 115 280 375');const caption=document.createElement('b');caption.textContent=label+' · '+frame;section.append(svg,caption);document.querySelector('#'+name).append(section);
 }
}
if(stored===null)localStorage.removeItem('kata-kinframe-v1');else localStorage.setItem('kata-kinframe-v1',stored);
document.querySelector('#result').textContent='Eight verified pose samples. This is a 2D FK puppet, without ankle, wrist, or finger channels.';
</script></html>
